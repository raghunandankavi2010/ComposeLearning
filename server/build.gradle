// Desktop (plain JVM) application that serves protobuf bytes over HTTP.
// Run it with:  ./gradlew :server:run
plugins {
    alias(libs.plugins.kotlin.jvm)
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

application {
    // The Kotlin file ServerMain.kt compiles to the class ServerMainKt.
    mainClass = 'com.example.composelearning.server.ServerMainKt'
}

dependencies {
    // Brings in the generated Contact / ContactList classes AND the protobuf
    // runtime (declared 'api' in :proto-models).
    implementation project(':proto-models')

    // RemoteCompose document creation on the JVM. We BUILD a RemoteCompose
    // document here on the server and serve its bytes; the Android app renders
    // them with the matching player. creation-jvm provides JvmRcPlatformServices.
    implementation libs.remote.creation.core
    implementation libs.remote.creation.jvm
}
