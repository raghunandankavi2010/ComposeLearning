<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="420" fill="#0f0b1f"/>
  <text x="380" y="30" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">shift / width  =  &#8722;position &#215; speed</text>
  <text x="380" y="50" fill="#8b84a8" font-size="13" text-anchor="middle">over one page (position 0&#8594;1); each layer is a line whose slope is its speed</text>

  <!-- axes -->
  <line x1="110" y1="90" x2="110" y2="380" stroke="#5a5570" stroke-width="1.5"/>
  <line x1="110" y1="90" x2="680" y2="90" stroke="#5a5570" stroke-width="1.5"/>

  <!-- x labels -->
  <text x="110" y="400" fill="#cfc9e6" font-size="12" text-anchor="middle">position 0</text>
  <text x="660" y="400" fill="#cfc9e6" font-size="12" text-anchor="middle">+1 (one page)</text>
  <text x="100" y="95" fill="#6f6a88" font-size="11" text-anchor="end">0</text>
  <text x="100" y="372" fill="#6f6a88" font-size="11" text-anchor="end">&#8592; shift left</text>

  <!-- lines from (110,90) to (660, 90 + speed*460) -->
  <line x1="110" y1="90" x2="660" y2="113" stroke="#ffffff" stroke-width="3"/>
  <text x="668" y="116" fill="#ffffff" font-size="11">0.05 stars</text>

  <line x1="110" y1="90" x2="660" y2="127" stroke="#FFE08A" stroke-width="3"/>
  <text x="668" y="132" fill="#FFE08A" font-size="11">0.08 sun/moon</text>

  <line x1="110" y1="90" x2="660" y2="159" stroke="#5C7CA8" stroke-width="3"/>
  <text x="668" y="162" fill="#5C7CA8" font-size="11">0.15 back hills</text>

  <line x1="110" y1="90" x2="660" y2="228" stroke="#cfc9e6" stroke-width="3"/>
  <text x="668" y="231" fill="#cfc9e6" font-size="11">0.30 clouds</text>

  <line x1="110" y1="90" x2="660" y2="297" stroke="#2F4A39" stroke-width="3"/>
  <text x="668" y="300" fill="#7da98c" font-size="11">0.45 front hills</text>

  <line x1="110" y1="90" x2="660" y2="366" stroke="#FF6B81" stroke-width="3"/>
  <text x="668" y="369" fill="#FF6B81" font-size="11">0.60 birds</text>

  <circle cx="110" cy="90" r="4" fill="#ffffff"/>
  <text x="120" y="82" fill="#ffffff" font-size="11">all layers aligned at the start of a page</text>
</svg>
