<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="420" fill="#0f0b1f"/>
  <text x="380" y="30" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">shift / width  =  &#8722;pageOffset &#215; speed</text>
  <text x="380" y="50" fill="#8b84a8" font-size="13" text-anchor="middle">across one swipe (pageOffset 0&#8594;1); each layer is a line whose slope is its speed</text>

  <!-- axes -->
  <line x1="110" y1="90" x2="110" y2="380" stroke="#5a5570" stroke-width="1.5"/>
  <line x1="110" y1="90" x2="690" y2="90" stroke="#5a5570" stroke-width="1.5"/>

  <text x="110" y="400" fill="#cfc9e6" font-size="12" text-anchor="middle">pageOffset 0 (still)</text>
  <text x="660" y="400" fill="#cfc9e6" font-size="12" text-anchor="middle">+1 (one page)</text>
  <text x="100" y="95" fill="#6f6a88" font-size="11" text-anchor="end">0</text>
  <text x="100" y="372" fill="#6f6a88" font-size="11" text-anchor="end">&#8592; shift left</text>

  <!-- lines from (110,90) to (660, 90 + speed*350) -->
  <line x1="110" y1="90" x2="660" y2="111" stroke="#ffffff" stroke-width="3"/>
  <text x="668" y="114" fill="#ffffff" font-size="11">0.06 stars</text>

  <line x1="110" y1="90" x2="660" y2="125" stroke="#FFE08A" stroke-width="3"/>
  <text x="668" y="130" fill="#FFE08A" font-size="11">0.10 sun/moon</text>

  <line x1="110" y1="90" x2="660" y2="167" stroke="#5C7CA8" stroke-width="3"/>
  <text x="668" y="170" fill="#5C7CA8" font-size="11">0.22 back hills</text>

  <line x1="110" y1="90" x2="660" y2="230" stroke="#cfc9e6" stroke-width="3"/>
  <text x="668" y="233" fill="#cfc9e6" font-size="11">0.40 clouds</text>

  <line x1="110" y1="90" x2="660" y2="282" stroke="#2F4A39" stroke-width="3"/>
  <text x="668" y="285" fill="#7da98c" font-size="11">0.55 front hills</text>

  <line x1="110" y1="90" x2="660" y2="363" stroke="#FF6B81" stroke-width="3"/>
  <text x="668" y="366" fill="#FF6B81" font-size="11">0.78 birds</text>

  <circle cx="110" cy="90" r="4" fill="#ffffff"/>
  <text x="120" y="82" fill="#ffffff" font-size="11">all layers aligned when the page is centered</text>
</svg>
