<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="220" fill="#0f0b1f"/>
  <text x="380" y="30" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">position = currentPage + currentPageOffsetFraction</text>

  <!-- number line -->
  <line x1="60" y1="120" x2="700" y2="120" stroke="#5a5570" stroke-width="2"/>

  <!-- ticks for pages 0..3 -->
  <g fill="#cfc9e6" font-size="13" text-anchor="middle">
    <line x1="100" y1="112" x2="100" y2="128" stroke="#8b84a8" stroke-width="2"/>
    <text x="100" y="150">page 0</text>
    <line x1="300" y1="112" x2="300" y2="128" stroke="#8b84a8" stroke-width="2"/>
    <text x="300" y="150">page 1</text>
    <line x1="500" y1="112" x2="500" y2="128" stroke="#8b84a8" stroke-width="2"/>
    <text x="500" y="150">page 2</text>
    <line x1="700" y1="112" x2="700" y2="128" stroke="#8b84a8" stroke-width="2"/>
    <text x="700" y="150">page 3</text>
  </g>

  <!-- pointer at position 1.6 (60% between page 1 and 2) -->
  <g>
    <line x1="420" y1="70" x2="420" y2="120" stroke="#6C5CE7" stroke-width="3"/>
    <circle cx="420" cy="120" r="7" fill="#6C5CE7"/>
    <polygon points="420,64 414,76 426,76" fill="#6C5CE7"/>
    <text x="420" y="58" fill="#b5aef0" font-size="14" font-weight="700" text-anchor="middle">position = 1.6</text>
  </g>

  <!-- fraction bracket between page 1 and pointer -->
  <text x="360" y="190" fill="#8b84a8" font-size="12" text-anchor="middle">currentPage = 1, offsetFraction = 0.6</text>
  <text x="560" y="190" fill="#8b84a8" font-size="12" text-anchor="middle">drag continues &#8594; position rises toward 2.0</text>
</svg>
