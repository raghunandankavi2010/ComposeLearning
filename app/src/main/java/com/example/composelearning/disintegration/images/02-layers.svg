<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="img2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0A84FF"/>
      <stop offset="0.5" stop-color="#BF5AF2"/>
      <stop offset="1"   stop-color="#FF9F0A"/>
    </linearGradient>
  </defs>

  <rect width="820" height="400" fill="#FBFBFD"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1d1d1f">Two cheap layers = one convincing dissolve</text>
  <text x="40" y="64" font-size="14" fill="#6e6e73">macro fade-out (strips) + micro floating dust (particles) → the eye reads a solid object crumbling</text>

  <!-- Panel 1: STRIPS -->
  <g transform="translate(40,100)">
    <text x="110" y="-8" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">Strips — the eroding body</text>
    <!-- 11 vertical slices, left ones faded (gone), middle fading, right solid -->
    <g>
      <rect x="0"   y="0" width="18" height="180" fill="url(#img2)" opacity="0.05"/>
      <rect x="20"  y="0" width="18" height="180" fill="url(#img2)" opacity="0.12"/>
      <rect x="40"  y="0" width="18" height="180" fill="url(#img2)" opacity="0.25"/>
      <rect x="60"  y="0" width="18" height="180" fill="url(#img2)" opacity="0.45"/>
      <rect x="80"  y="0" width="18" height="180" fill="url(#img2)" opacity="0.65"/>
      <rect x="100" y="0" width="18" height="180" fill="url(#img2)" opacity="0.82"/>
      <rect x="120" y="0" width="18" height="180" fill="url(#img2)" opacity="0.92"/>
      <rect x="140" y="0" width="18" height="180" fill="url(#img2)" opacity="1"/>
      <rect x="160" y="0" width="18" height="180" fill="url(#img2)" opacity="1"/>
      <rect x="180" y="0" width="18" height="180" fill="url(#img2)" opacity="1"/>
      <rect x="200" y="0" width="18" height="180" fill="url(#img2)" opacity="1"/>
    </g>
    <rect x="-2" y="0" width="222" height="180" fill="none" stroke="#d2d2d7" stroke-width="1.5"/>
    <text x="110" y="202" font-size="12" fill="#6e6e73" text-anchor="middle">column alpha = 1 − f  (one drawImage each)</text>
  </g>

  <text x="295" y="195" font-size="34" fill="#86868b" text-anchor="middle">+</text>

  <!-- Panel 2: PARTICLES -->
  <g transform="translate(320,100)">
    <text x="110" y="-8" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">Particles — the dust</text>
    <rect x="-2" y="0" width="222" height="180" fill="none" stroke="#d2d2d7" stroke-width="1.5"/>
    <!-- dust drifting up & right, fading out -->
    <g>
      <rect x="30"  y="150" width="8" height="8" fill="#0A84FF" opacity="0.9"/>
      <rect x="55"  y="130" width="7" height="7" fill="#BF5AF2" opacity="0.8"/>
      <rect x="80"  y="108" width="7" height="7" fill="#BF5AF2" opacity="0.7"/>
      <rect x="105" y="85"  width="6" height="6" fill="#FF453A" opacity="0.55"/>
      <rect x="128" y="62"  width="6" height="6" fill="#FF9F0A" opacity="0.4"/>
      <rect x="150" y="44"  width="5" height="5" fill="#FF9F0A" opacity="0.28"/>
      <rect x="45"  y="158" width="8" height="8" fill="#0A84FF" opacity="0.85"/>
      <rect x="72"  y="138" width="7" height="7" fill="#BF5AF2" opacity="0.7"/>
      <rect x="98"  y="116" width="6" height="6" fill="#FF453A" opacity="0.55"/>
      <rect x="122" y="92"  width="6" height="6" fill="#FF453A" opacity="0.42"/>
      <rect x="146" y="70"  width="5" height="5" fill="#FF9F0A" opacity="0.3"/>
      <rect x="170" y="50"  width="5" height="5" fill="#FF9F0A" opacity="0.2"/>
    </g>
    <!-- wind arrow -->
    <line x1="40" y1="120" x2="150" y2="60" stroke="#86868b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
    <text x="110" y="202" font-size="12" fill="#6e6e73" text-anchor="middle">travel = f²,  alpha = 4·f·(1−f)  (one drawRect each)</text>
  </g>

  <text x="575" y="195" font-size="30" fill="#86868b" text-anchor="middle">=</text>

  <!-- Panel 3: RESULT -->
  <g transform="translate(600,100)">
    <text x="100" y="-8" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">What you see</text>
    <rect x="-2" y="0" width="202" height="180" fill="none" stroke="#d2d2d7" stroke-width="1.5"/>
    <!-- solid right side -->
    <rect x="90" y="0" width="110" height="180" fill="url(#img2)"/>
    <rect x="60" y="0" width="30"  height="180" fill="url(#img2)" opacity="0.6"/>
    <rect x="40" y="0" width="20"  height="180" fill="url(#img2)" opacity="0.3"/>
    <!-- dust on top -->
    <g>
      <rect x="35"  y="150" width="8" height="8" fill="#0A84FF" opacity="0.9"/>
      <rect x="58"  y="120" width="7" height="7" fill="#BF5AF2" opacity="0.75"/>
      <rect x="80"  y="92"  width="6" height="6" fill="#FF453A" opacity="0.55"/>
      <rect x="100" y="64"  width="6" height="6" fill="#FF9F0A" opacity="0.4"/>
      <rect x="120" y="44"  width="5" height="5" fill="#FF9F0A" opacity="0.25"/>
      <rect x="20"  y="135" width="7" height="7" fill="#0A84FF" opacity="0.7"/>
      <rect x="48"  y="100" width="6" height="6" fill="#BF5AF2" opacity="0.5"/>
    </g>
    <text x="100" y="202" font-size="12" fill="#6e6e73" text-anchor="middle">crossfade hides the seam</text>
  </g>

  <text x="40" y="360" font-size="13" fill="#6e6e73">Pure particles would need 100k+ squares to look crisp and tank the frame rate. The strips supply the crisp</text>
  <text x="40" y="380" font-size="13" fill="#6e6e73">body for free, so a sparse sampled set of particles only has to sell the breaking edge.</text>

  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#86868b"/>
    </marker>
  </defs>
</svg>
