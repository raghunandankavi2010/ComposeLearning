// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.compose.compiler) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.protobuf) apply false
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.google.services) apply false
}

def ktlintVersion = libs.versions.ktlint.get()
def composeRulesVersion = libs.versions.composeRules.get()

// Mirrors .editorconfig — Spotless doesn't reliably pick up ktlint_* properties
// from .editorconfig, so rule configuration lives here for the build
def ktlintOverrides = [
    'ktlint_code_style'                                : 'android_studio',
    'max_line_length'                                  : 'off',
    'ktlint_function_naming_ignore_when_annotated_with': 'Composable, Preview',
    // Standard rules relaxed for this sample/learning codebase
    'ktlint_standard_no-wildcard-imports'              : 'enabled',
    'ij_kotlin_packages_to_use_import_on_demand'       : 'unset',
    'ktlint_standard_value-parameter-comment'          : 'disabled',
    'ktlint_standard_value-argument-comment'           : 'disabled',
    'ktlint_standard_property-naming'                  : 'disabled',
    'ktlint_standard_backing-property-naming'          : 'enabled',
    'ktlint_standard_kdoc'                             : 'disabled',
    'ktlint_standard_no-empty-file'                    : 'disabled',
    // CompositionLocals intentionally defined in this project
    'compose_allowed_composition_locals'               : 'LocalAnimationsEnabled, LocalSpotlightController, LocalSharedTransitionScope, LocalNavAnimatedVisibilityScope, LocalAnimatedVisibilityScope',
    // Demo screens are self-contained; skip Compose API-shape rules
    'ktlint_compose_modifier-missing-check'            : 'disabled',
    'ktlint_compose_modifier-reused-check'             : 'disabled',
    'ktlint_compose_modifier-not-used-at-root'         : 'disabled',
    'ktlint_compose_modifier-composed-check'           : 'disabled',
    'ktlint_compose_modifier-clickable-order'          : 'disabled',
    'ktlint_compose_param-order-check'                 : 'disabled',
    'ktlint_compose_parameter-naming'                  : 'disabled',
    'ktlint_compose_naming-check'                      : 'disabled',
    'ktlint_compose_lambda-param-in-effect'            : 'disabled',
    'ktlint_compose_lambda-param-event-trailing'       : 'disabled',
    'ktlint_compose_content-trailing-lambda'           : 'disabled',
    'ktlint_compose_vm-forwarding-check'               : 'disabled',
    'ktlint_compose_mutable-state-param-check'         : 'disabled',
    'ktlint_compose_mutable-params-check'              : 'disabled',
    'ktlint_compose_mutable-state-autoboxing'          : 'disabled',
    'ktlint_compose_multiple-emitters-check'           : 'disabled',
    'ktlint_compose_state-param-check'                 : 'disabled',
    // Showcase screens reuse @Preview composables across files, so they must stay public
    'ktlint_compose_preview-public-check'              : 'disabled',
]

allprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        kotlin {
            target 'src/**/*.kt'
            targetExclude '**/build/**'
            ktlint(ktlintVersion)
                .editorConfigOverride(ktlintOverrides)
                .customRuleSets(["io.nlopez.compose.rules:ktlint:$composeRulesVersion".toString()])
            trimTrailingWhitespace()
            endWithNewline()
        }
        format 'misc', {
            target '*.gradle', '*.md', '.gitignore', 'src/**/*.xml'
            targetExclude '**/build/**'
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}
